name: ilmsaathi

x-node-runtime: &node-runtime
  image: node:22-alpine
  working_dir: /workspace
  init: true
  volumes:
    - ./:/workspace
    - node_modules:/workspace/node_modules
    - npm_cache:/root/.npm
  networks:
    - ilmsaathi

services:
  dependencies:
    <<: *node-runtime
    command:
      - sh
      - -ec
      - |
        test -f package-lock.json || {
          echo "package-lock.json is required; generate and commit it with npm install"
          exit 2
        }
        npm ci --no-audit --no-fund
        npm run build --workspace packages/shared
    restart: "no"

  mongo-keyfile:
    image: mongo:8.0
    user: "0:0"
    entrypoint: ["bash", "-ec"]
    command:
      - |
        keyfile=/data/configdb/mongodb-keyfile
        if [ ! -s "$$keyfile" ]; then
          umask 077
          printf '%s' "$${MONGO_REPLICA_SET_KEY}" > "$$keyfile"
        fi
        chown mongodb:mongodb "$$keyfile"
        chmod 400 "$$keyfile"
    environment:
      MONGO_REPLICA_SET_KEY: ${MONGO_REPLICA_SET_KEY:?Run node scripts/generate-env.mjs first}
    volumes:
      - mongo_config:/data/configdb
    restart: "no"
    networks:
      - ilmsaathi

  mongo:
    image: mongo:8.0
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /data/configdb/mongodb-keyfile
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-ilmsaathi}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Run node scripts/generate-env.mjs first}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run node scripts/generate-env.mjs first}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    depends_on:
      mongo-keyfile:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      - ilmsaathi

  mongo-rs-init:
    image: mongo:8.0
    entrypoint: ["bash", "-ec"]
    command:
      - |
        mongosh --quiet --host mongo \
          --username "$${MONGO_INITDB_ROOT_USERNAME}" \
          --password "$${MONGO_INITDB_ROOT_PASSWORD}" \
          --authenticationDatabase admin \
          --eval '
            try {
              const status = rs.status();
              if (status.set !== "rs0") {
                throw new Error("Unexpected replica-set name: " + status.set);
              }
            } catch (error) {
              if (error.code !== 94 && error.codeName !== "NotYetInitialized") {
                throw error;
              }
              const result = rs.initiate({
                _id: "rs0",
                members: [{ _id: 0, host: "mongo:27017" }]
              });
              if (!result.ok) {
                printjson(result);
                quit(2);
              }
            }

            let ready = false;
            for (let attempt = 0; attempt < 60; attempt += 1) {
              const hello = db.hello();
              if (hello.isWritablePrimary && hello.setName === "rs0") {
                ready = true;
                break;
              }
              sleep(1000);
            }
            quit(ready ? 0 : 2);
          '
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Run node scripts/generate-env.mjs first}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run node scripts/generate-env.mjs first}
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    networks:
      - ilmsaathi

  api:
    <<: *node-runtime
    restart: unless-stopped
    command: ["npm", "run", "dev", "--workspace", "apps/api"]
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-4000}
      MONGODB_URI: ${MONGODB_URI_DOCKER:?Run node scripts/generate-env.mjs first}
      WEB_URL: http://localhost:${WEB_PORT:-5173}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-5173}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:${API_PORT:-4000}"
    depends_on:
      dependencies:
        condition: service_completed_successfully
      mongo-rs-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + (process.env.PORT || 4000) + '/api/health/ready')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 25s
    stop_grace_period: 15s

  web:
    <<: *node-runtime
    restart: unless-stopped
    command: ["npm", "run", "dev", "--workspace", "apps/web"]
    env_file:
      - .env
    environment:
      WEB_PORT: ${WEB_PORT:-5173}
      API_INTERNAL_URL: http://api:${API_PORT:-4000}
      VITE_API_BASE_URL: /api/v1
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:${WEB_PORT:-5173}"
    depends_on:
      dependencies:
        condition: service_completed_successfully
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + (process.env.WEB_PORT || 5173) + '/')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 25s
    stop_grace_period: 10s

volumes:
  mongo_data:
  mongo_config:
  node_modules:
  npm_cache:

networks:
  ilmsaathi:
    driver: bridge
